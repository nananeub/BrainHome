'use strict';const KEY='brainhome-v02';const roots=[['Studienstiftung','🤝'],['Doktorarbeit','🧪'],['Uni','🎓'],['Beziehungen','♡'],['Privat','⌂']];const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();let data;function initial(){return {version:2,nodes:roots.map(([name,emoji])=>({id:uid(),parent:null,name,emoji,done:false,priority:'bald',due:'',notes:'',collapsed:false})),tab:'projects',active:null}}try{data=JSON.parse(localStorage.getItem(KEY));if(!data||!Array.isArray(data.nodes))throw Error()}catch{data=initial()}let depthLimit=5,showDone=true,editId=null,newParent=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=id=>data.nodes.find(n=>n.id===id),kids=id=>data.nodes.filter(n=>n.parent===id),rootOf=n=>{while(n&&n.parent)n=get(n.parent);return n},rootName=n=>rootOf(n)?.name||'Donna';const descendants=id=>{let out=[];for(const n of kids(id)){out.push(n.id,...descendants(n.id))}return out};function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Speichern fehlgeschlagen! Bitte ein Backup exportieren.')}}function notice(s){$('notice').textContent=s;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2200)}function setTab(t){data.tab=t;save();render()}function openProject(id){data.active=id;data.tab='tree';save();render()}function setDone(id,v){get(id).done=v;save();render()}function toggle(id){get(id).collapsed=!get(id).collapsed;save();render()}function path(n){let p=[n.name];while(n.parent){n=get(n.parent);if(!n)break;p.unshift(n.name)}return p.join(' › ')}function nodeHTML(n,depth){if(!showDone&&n.done)return '';const child=kids(n.id).filter(x=>showDone||!x.done),expand=depth<depthLimit&&!n.collapsed;return `<div class="branch"><div class="node ${n.done?'done':''}"><span class="status">${n.done?'✓ Erledigt':esc(n.priority||'bald')}</span><span class="name">${esc(n.name)} ata-action="showdone">${showDone?'✓ Erledigte sichtbar':'Erledigte zeigen'}</button></div><div class="tree-scroll"><div class="tree">${nodeHTML(root,0)}</div></div><p class="hint">Seitlich wischen, um breite Äste zu sehen. Tippe auf ＋ an einem Knoten, um dort einen neuen Zweig anzulegen. Alle Änderungen werden automatisch gespeichert.</p>`}else{let nodes=data.nodes.filter(n=>n.parent&&(data.tab==='inbox'?rootName(n)==='Donna':!n.done));if(data.tab==='inbox')nodes=data.nodes.filter(n=>n.parent==='inbox');const order={sofort:0,wichtig:1,jetzt:2,bald:3,wartet:4,irgendwann:5};nodes.sort((a,b)=>(order[a.priority]??1)-(order[b.priority]??1));a.innerHTML=`<div class="topline"><div><h2>${data.tab==='inbox'?'Donna · Eingang':'Alle offenen Aufgaben'}</h2><p class="muted">${data.tab==='inbox'?'Schnell sammeln, später einsortieren.':'Projektübergreifend, ohne Pflichttermine.'}</p></div><button class="btn primary" data-action="add" data-id="${data.tab==='inbox'?'inbox':''}">＋ Aufgabe</button></div><div class="tasks">${nodes.length?nodes.map(n=>`<div class="task"><input type="checkbox" data-action="done" data-id="${n.id}" ${n.done?'checked':''}><div class="detail"><strong>${esc(n.name)}</strong><small>${esc(path(n))} · ${esc(n.priority||'bald')}${n.due?' · '+esc(n.due):''}</small></div><button class="btn" data-action="edit" data-id="${n.id}">✎</button></div>`).join(''):'<div class="panel muted">Noch keine Aufgaben hier.</div>'}</div>`}}function options(exclude){const valid=data.nodes.filter(n=>n.id!==exclude&&!descendants(exclude||'').includes(n.id));return `<option value="inbox">Donna · Eingang</option>`+valid.map(n=>`<option value="${n.id}">${esc(path(n))}</option>`).join('')}function openEditor(id,parent){editId=id||null;newParent=parent||null;const n=id?get(id):null;$('editHeading').textContent=n?'Eintrag bearbeiten':'Neuer Eintrag';$('name').value=n?.name||'';$('priority').value=n?.priority||'bald';$('kind').value=n?.kind||'task';$('birthday').value=n?.birthday||'';$('birthdayField').hidden=$('kind').value!=='gift';$('due').value=n?.due||'';$('notes').value=n?.notes||'';$('parent').innerHTML=options(id);$('parent').value=n?.parent||parent||'inbox';$('deleteBtn').hidden=!n;$('editor').showModal();$('name').focus()}$('editForm').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;const parent=$('parent').value;const fields={name,priority:$('priority').value,due:$('due').value,notes:$('notes').value,parent,kind:$('kind').value,birthday:$('birthday').value};if(editId){Object.assign(get(editId),fields)}else data.nodes.push({id:uid(),done:false,collapsed:false,...fields});save();$('editor').close();render();notice('Gespeichert')});$('kind').onchange=()=>$('birthdayField').hidden=$('kind').value!=='gift';$('cancelBtn').onclick=()=>$('editor').close();$('deleteBtn').onclick=()=>{if(!editId)return;const ids=[editId,...descendants(editId)];if(!confirm(`Diesen Punkt und ${ids.length-1} Unterpunkte wirklich löschen?`))return;data.nodes=data.nodes.filter(n=>!ids.includes(n.id));save();$('editor').close();render()};document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id;switch(b.dataset.action){case'project':openProject(id);break;case'back':setTab('projects');break;case'add':openEditor(null,id);break;case'edit':openEditor(id);break;case'done':setDone(id,!get(id).done);break;case'toggle':toggle(id);break;case'deeper':depthLimit=Math.min(100,depthLimit+5);render();break;case'less':depthLimit=Math.max(1,depthLimit-5);render();break;case'showdone':showDone=!showDone;render();break}});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('backupBtn').onclick=()=>$('backupDialog').showModal();$('closeBackup').onclick=()=>$('backupDialog').close();$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,nodes:data.nodes},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BrainHome-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d.nodes)||!d.nodes.every(n=>typeof n.id==='string'&&typeof n.name==='string'&&typeof n.parent==='string'||n.parent===null&&typeof n.id==='string'&&typeof n.name==='string'))throw Error('Ungültiges Format');if(!confirm('Alle aktuellen Aufgaben durch dieses Backup ersetzen?'))return;data={version:2,nodes:d.nodes,tab:'projects',active:null};save();$('backupDialog').close();render();notice('Backup importiert')}catch(err){alert('Import fehlgeschlagen: '+err.message)}e.target.value=''};render();

const priorityLabel={sofort:'Sofort',wichtig:'Wichtig',jetzt:'Jetzt',bald:'Bald',irgendwann:'Irgendwann',wartet:'Wartet'};
const priorityOrder={sofort:0,wichtig:1,jetzt:2,bald:3,wartet:4,irgendwann:5};
const kindOf=n=>n.kind||'task';
const isTask=n=>kindOf(n)==='task';
const isCategory=n=>kindOf(n)==='category';
const isPantry=n=>kindOf(n)==='pantry';
const isGift=n=>kindOf(n)==='gift';
function nextBirthdayDays(n){if(!n.birthday)return null;const b=new Date(n.birthday+'T12:00:00');if(Number.isNaN(b.getTime()))return null;const today=new Date();const t=new Date(today.getFullYear(),today.getMonth(),today.getDate(),12);let year=t.getFullYear();let d=new Date(year,b.getMonth(),b.getDate(),12);if(d<t)d=new Date(++year,b.getMonth(),b.getDate(),12);return Math.round((d-t)/86400000)}
function giftDue(n){const days=nextBirthdayDays(n);return days!==null&&days<=28&&!n.done}
function iconFor(n){return isCategory(n)?'▣':isPantry(n)?'▤':isGift(n)?'🎁':'□'}
function nodeHTML(n,depth){if(!showDone&&isTask(n)&&n.done)return '';const child=kids(n.id).filter(x=>showDone||!isTask(x)||!x.done),expand=depth<depthLimit&&!n.collapsed;const category=isCategory(n),pantry=isPantry(n),gift=isGift(n),done=isTask(n)&&n.done;const status=category?'Kategorie':pantry?(n.done?'Vorhanden':'Einkaufen'):gift?(giftDue(n)?'🎁 Geschenk besorgen':n.done?'Geschenk besorgt':'Geburtstag'):(done?'✓ Erledigt':priorityLabel[n.priority]||'Bald');return `<div class="branch"><div class="node ${done?'done':''}" data-kind="${kindOf(n)}" data-priority="${esc(n.priority||'bald')}"><span class="status">${esc(status)}</span><span class="name">${esc(n.name)}</span><div class="actions"><button class="mini" data-action="add" data-id="${n.id}" title="Unterpunkt hinzufügen">＋</button><button class="mini" data-action="edit" data-id="${n.id}" title="Bearbeiten">✎</button>${!category?`<button class="mini" data-action="done" data-id="${n.id}" title="${n.done?'Zurücksetzen':'Abhaken'}">${n.done?'↺':'✓'}</button>`:''}${child.length?`<button class="mini" data-action="toggle" data-id="${n.id}" title="Auf- oder zuklappen">${expand?'−':'+'}${child.length}</button>`:''}</div></div>${child.length&&expand?`<div class="children">${child.map(x=>nodeHTML(x,depth+1)).join('')}</div>`:child.length&&!n.collapsed?`<button class="btn leaf-more" data-action="deeper">${child.length} weitere · Tiefe erhöhen</button>`:''}</div>`}
function outlineHTML(n,depth=0){if(!showDone&&isTask(n)&&n.done)return '';const child=kids(n.id).filter(x=>showDone||!isTask(x)||!x.done);const expanded=!n.collapsed&&depth<depthLimit;const label=isCategory(n)?'Kategorie':isPantry(n)?(n.done?'Vorhanden':'Einkaufen'):isGift(n)?(giftDue(n)?'Geschenk offen':'Geschenk'):priorityLabel[n.priority]||'Bald';return `<div class="outline-item ${isTask(n)&&n.done?'done':''}" data-kind="${kindOf(n)}" data-priority="${esc(n.priority||'bald')}"><div class="outline-row">${child.length?`<button class="mini" data-action="toggle" data-id="${n.id}" title="Auf-/zuklappen">${expanded?'▾':'▸'}</button>`:'<span style="width:24px"></span>'}<span class="outline-name">${iconFor(n)} ${esc(n.name)}</span><span class="tag ${esc(n.priority||'')}">${esc(label)}</span><button class="mini" data-action="add" data-id="${n.id}" title="Unterpunkt">＋</button><button class="mini" data-action="edit" data-id="${n.id}" title="Bearbeiten">✎</button>${!isCategory(n)?`<button class="mini" data-action="done" data-id="${n.id}" title="Status wechseln">${n.done?'↺':'✓'}</button>`:''}</div>${expanded?child.map(x=>outlineHTML(x,depth+1)).join(''):''}${!n.collapsed&&child.length&&depth>=depthLimit?'<button class="btn" data-action="deeper">Weitere Ebenen anzeigen</button>':''}</div>`}
function getOrCreateSpecial(parentId,name){return data.nodes.find(n=>n.parent===parentId&&n.name===name&&isCategory(n))}
function ensurePrivateCategories(){const priv=data.nodes.find(n=>n.parent===null&&n.name==='Privat');if(!priv)return;let changed=false;for(const name of ['Essen','Geschenke']){if(!getOrCreateSpecial(priv.id,name)){data.nodes.push({id:uid(),parent:priv.id,name,kind:'category',done:false,priority:'bald',due:'',notes:'',collapsed:false});changed=true}}if(changed)save()}
ensurePrivateCategories();
function allNodesOfKind(kind){return data.nodes.filter(n=>kindOf(n)===kind)}
function specialsHTML(){const pantry=allNodesOfKind('pantry');const gifts=allNodesOfKind('gift');const needed=pantry.filter(n=>!n.done);const upcoming=gifts.filter(giftDue).sort((a,b)=>nextBirthdayDays(a)-nextBirthdayDays(b));return `<div class="section-box"><div class="topline"><h3>🛒 Einkaufsliste <small>(${needed.length})</small></h3><button class="btn" data-action="special-add" data-kind="pantry">＋ Vorrat</button></div>${pantry.length?pantry.map(n=>`<div class="shopping-item"><input type="checkbox" data-action="done" data-id="${n.id}" ${n.done?'checked':''} aria-label="${esc(n.name)} vorhanden"><label>${esc(n.name)} <small>${n.done?'· vorhanden':'· einkaufen'}</small></label><button class="mini" data-action="edit" data-id="${n.id}">✎</button></div>`).join(''):'<p class="hint">Noch keine Vorräte eingetragen. Ein Häkchen bedeutet: vorhanden.</p>'}</div><div class="section-box"><div class="topline"><h3>🎁 Geschenke <small>(${upcoming.length} offen)</small></h3><button class="btn" data-action="special-add" data-kind="gift">＋ Person</button></div>${gifts.length?gifts.slice().sort((a,b)=>(nextBirthdayDays(a)??999)-(nextBirthdayDays(b)??999)).map(n=>`<div class="shopping-item"><input type="checkbox" data-action="done" data-id="${n.id}" ${n.done?'checked':''} aria-label="Geschenk für ${esc(n.name)} besorgt"><label>${esc(n.name)} <small>${n.birthday?'· '+esc(n.birthday.slice(5).split('-').reverse().join('.')):''} ${nextBirthdayDays(n)!==null?'· in '+nextBirthdayDays(n)+' Tagen':''}</small> ${giftDue(n)?'<span class="birthday-soon">🎁 Geschenk besorgen</span>':n.done?'<span class="hint-strong">Geschenk besorgt</span>':''}</label><button class="mini" data-action="edit" data-id="${n.id}">✎</button></div>`).join(''):'<p class="hint">Noch keine Geburtstage eingetragen.</p>'}</div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===data.tab||(data.tab==='tree'&&b.dataset.tab==='projects')));const a=$('app');if(data.tab==='projects'){a.innerHTML=`<h2>Deine Lebensbereiche</h2><div class="project-grid">${data.nodes.filter(n=>n.parent===null).map(n=>`<button class="project" data-action="project" data-id="${n.id}"><strong>${esc(n.emoji||'🌿')} ${esc(n.name)}</strong><small>${descendants(n.id).map(get).filter(x=>x&&isTask(x)&&!x.done).length} offene Aufgaben</small></button>`).join('')}</div><p class="hint">Donna ist dein Eingang für ungeordnete Gedanken.</p>`;return}if(data.tab==='tree'){const root=get(data.active);if(!root){setTab('projects');return}const isPrivate=root.name==='Privat';a.innerHTML=`<div class="topline"><div><button class="btn" data-action="back">← Projekte</button><h2>${esc(root.emoji||'🌿')} ${esc(root.name)}</h2></div><button class="btn primary" data-action="add" data-id="${root.id}">＋ Eintrag</button></div><div class="toolbar"><div class="view-switch"><button class="btn ${viewMode==='visual'?'active':''}" data-action="view" data-view="visual">Verzweigter Baum</button><button class="btn ${viewMode==='outline'?'active':''}" data-action="view" data-view="outline">Ordnerbaum</button></div><button class="btn" data-action="less">− Tiefe</button><span class="muted">${depthLimit} Ebenen</span><button class="btn" data-action="deeper">＋ Tiefe</button><button class="btn" data-action="showdone">${showDone?'✓ Erledigte sichtbar':'Erledigte zeigen'}</button></div>${viewMode==='visual'?`<div class="tree-scroll"><div class="tree">${nodeHTML(root,0)}</div></div>`:`<div class="section-box outline-tree">${outlineHTML(root,0)}</div>`}<p class="hint">Kategorien sind dauerhaft und werden nicht abgehakt. Aufgaben können jederzeit in Kategorien umgewandelt werden.</p>${isPrivate?specialsHTML():''}`;return}if(data.tab==='inbox'){const nodes=data.nodes.filter(n=>n.parent==='inbox');a.innerHTML=`<div class="topline"><div><h2>Donna · Eingang</h2><p class="muted">Sammeln und später einsortieren.</p></div><button class="btn primary" data-action="add" data-id="inbox">＋ Eintrag</button></div><div class="tasks">${taskRows(nodes)}</div>`;return}const nodes=data.nodes.filter(n=>n.parent&&isTask(n)&&!n.done).sort((a,b)=>(priorityOrder[a.priority]??3)-(priorityOrder[b.priority]??3));const upcoming=allNodesOfKind('gift').filter(giftDue);a.innerHTML=`<div class="topline"><div><h2>Alle offenen Aufgaben</h2><p class="muted">Nach Priorität geordnet · farbig nach Lebensbereich</p></div><button class="btn primary" data-action="add" data-id="inbox">＋ Aufgabe</button></div><div class="tasks">${taskRows(nodes)}${!nodes.length?'<div class="panel muted">Keine offenen Aufgaben.</div>':''}</div>${upcoming.length?`<div class="section-box"><h3>🎁 Baldige Geburtstage</h3>${upcoming.map(n=>`<div class="shopping-item"><span class="birthday-soon">${esc(n.name)} · ${nextBirthdayDays(n)} Tage</span><button class="mini" data-action="edit" data-id="${n.id}">✎</button></div>`).join('')}</div>`:''}`}
function taskRows(nodes){return nodes.map(n=>{const area=rootName(n);const priority=n.priority||'bald';return `<div class="task" data-priority="${esc(priority)}" data-area="${esc(area)}"><input type="checkbox" data-action="done" data-id="${n.id}" ${n.done?'checked':''}><div class="detail"><strong>${esc(n.name)}</strong><small><span class="area-dot"></span>${esc(path(n))} · <span class="tag ${esc(priority)}">${esc(priorityLabel[priority]||priority)}</span>${n.due?' · '+esc(n.due):''}</small></div><button class="btn" data-action="edit" data-id="${n.id}">✎</button></div>`}).join('')}
// Override only click handling for newly introduced actions; original handler continues for existing ones.
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='view'){viewMode=b.dataset.view;localStorage.setItem(V04_PREF,viewMode);render()}if(b.dataset.action==='special-add'){const priv=data.nodes.find(n=>n.parent===null&&n.name==='Privat');const parent=priv&&getOrCreateSpecial(priv.id,b.dataset.kind==='pantry'?'Essen':'Geschenke');openEditor(null,parent?.id||priv?.id||'inbox');$('kind').value=b.dataset.kind;$('birthdayField').hidden=b.dataset.kind!=='gift'}},true);
// Categories cannot be checked, including on imported data.
const originalSetDone=setDone;setDone=function(id,v){const n=get(id);if(!n||isCategory(n))return;originalSetDone(id,v)};
// On a new gift cycle, reset a completed gift after the birthday has passed.
const giftCycleKey='brainhome-v04-gift-cycles';
try{const cycles=JSON.parse(localStorage.getItem(giftCycleKey)||'{}');let changed=false;for(const n of allNodesOfKind('gift')){if(!n.birthday)continue;const b=new Date(n.birthday+'T12:00:00'),today=new Date();const thisYear=new Date(today.getFullYear(),b.getMonth(),b.getDate(),12);const cycle=today>thisYear?today.getFullYear()+1:today.getFullYear();if(n.done&&cycles[n.id]&&cycles[n.id]<cycle){n.done=false;changed=true}cycles[n.id]=cycle}localStorage.setItem(giftCycleKey,JSON.stringify(cycles));if(changed)save()}catch(e){console.warn('Geburtstagszyklus:',e)}
render();
</script><script>if ('serviceWorker' in navigator) {window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline-Modus:',e)));}</script></body></html>
