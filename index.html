="button" class="btn" id="deleteBtn">Löschen</button><button type="button" class="btn" id="cancelBtn">Abbrechen</button><button type="submit" class="btn primary">Speichern</button></footer></form></dialog><dialog id="backupDialog"><div class="modal"><h2>Datensicherung</h2><p class="hint">Die Daten liegen nur in diesem Browser auf diesem Gerät. Sichere regelmäßig eine JSON-Datei. GitHub speichert deine persönlichen Aufgaben nicht.</p><button class="btn primary" id="exportBtn">Backup herunterladen</button><div class="field"><label for="importFile">Backup wiederherstellen (ersetzt alle aktuellen Daten)</label><input type="file" id="importFile" accept=".json,application/json"></div><footer><button class="btn" id="closeBackup">Schließen</button></footer></div></dialog><script>
'use strict';const KEY='brainhome-v02';const roots=[['Studienstiftung','🤝'],['Doktorarbeit','🧪'],['Uni','🎓'],['Beziehungen','♡'],['Privat','⌂']];const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();let data;function initial(){return {version:2,nodes:roots.map(([name,emoji])=>({id:uid(),parent:null,name,emoji,done:false,priority:'spaeter',due:'',notes:'',collapsed:false})),tab:'projects',active:null}}try{data=JSON.parse(localStorage.getItem(KEY));if(!data||!Array.isArray(data.nodes))throw Error()}catch{data=initial()}let depthLimit=5,showDone=true,editId=null,newParent=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=id=>data.nodes.find(n=>n.id===id),kids=id=>data.nodes.filter(n=>n.parent===id),rootOf=n=>{while(n&&n.parent)n=get(n.parent);return n},rootName=n=>rootOf(n)?.name||'Donna';const descendants=id=>{let out=[];for(const n of kids(id)){out.push(n.id,...descendants(n.id))}return out};function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Speichern fehlgeschlagen! Bitte ein Backup exportieren.')}}function notice(s){$('notice').textContent=s;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2200)}function setTab(t){data.tab=t;save();render()}function openProject(id){data.active=id;data.tab='tree';save();render()}function setDone(id,v){get(id).done=v;save();render()}function toggle(id){get(id).collapsed=!get(id).collapsed;save();render()}function path(n){let p=[n.name];while(n.parent){n=get(n.parent);if(!n)break;p.unshift(n.name)}return p.join(' › ')}function nodeHTML(n,depth){if(!showDone&&n.done)return '';const child=kids(n.id).filter(x=>showDone||!x.done),expand=depth<depthLimit&&!n.collapsed;return `<div class="branch"><div class="node ${n.done?'done':''}"><span class="status">${n.done?'✓ Erledigt':esc(n.priority||'bald')}</span><span class="name">${esc(n.name)}</span><div class="actions"><button class="mini" title="Unteraufgabe hinzufügen" data-action="add" data-id="${n.id}">＋</button><button class="mini" title="Bearbeiten" data-action="edit" data-id="${n.id}">✎</button><button class="mini" title="${n.done?'Wieder öffnen':'Erledigen'}" data-action="done" data-id="${n.id}">${n.done?'↺':'✓'}</button>${child.length?`<button class="mini" title="Zweig ein-/ausklappen" data-action="toggle" data-id="${n.id}">${expand?'−':'+'}${child.length}</button>`:''}</div></div>${child.length&&expand?`<div class="children">${child.map(x=>nodeHTML(x,depth+1)).join('')}</div>`:child.length&&!n.collapsed?`<button class="btn leaf-more" data-action="deeper">${child.length} weitere · Tiefe erhöhen</button>`:''}</div>`}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===data.tab||(data.tab==='tree'&&b.dataset.tab==='projects')));const a=$('app');if(data.tab==='projects'){a.innerHTML=`<div class="topline"><div><h2>Deine Lebensbereiche</h2></div></div><div class="project-grid">${data.nodes.filter(n=>!n.parent).map(n=>`<button class="project" data-action="project" data-id="${n.id}"><strong>${esc(n.emoji||'🌿')} ${esc(n.name)}</strong><small>${descendants(n.id).filter(id=>!get(id).done).length} offene Aufgaben</small></button>`).join('')}</div><p class="hint">Öffne einen Bereich, um deinen Baum zu sehen. Donna ist dein schneller Eingang für ungeordnete Gedanken.</p>`}else if(data.tab==='tree'){const root=get(data.active);if(!root){setTab('projects');return}a.innerHTML=`<div class="topline"><div><button class="btn" data-action="back">← Projekte</button><h2>${esc(root.emoji||'🌿')} ${esc(root.name)}</h2></div><button class="btn primary" data-action="add" data-id="${root.id}">＋ Aufgabe</button></div><div class="toolbar"><button class="btn" data-action="less">− Tiefe</button><span class="muted">${depthLimit} Ebenen</span><button class="btn" data-action="deeper">＋ Tiefe</button><button class="btn" data-action="showdone">${showDone?'✓ Erledigte sichtbar':'Erledigte zeigen'}</button></div><div class="tree-scroll"><div class="tree">${nodeHTML(root,0)}</div></div><p class="hint">Seitlich wischen, um breite Äste zu sehen. Tippe auf ＋ an einem Knoten, um dort einen neuen Zweig anzulegen. Alle Änderungen werden automatisch gespeichert.</p>`}else{let nodes=data.nodes.filter(n=>n.parent&&(data.tab==='inbox'?rootName(n)==='Donna':!n.done));if(data.tab==='inbox')nodes=data.nodes.filter(n=>n.parent==='inbox');const order={sofort:0,wichtig:1,jetzt:2,bald:3,wartet:4,irgendwann:5};nodes.sort((a,b)=>(order[a.priority]??1)-(order[b.priority]??1));a.innerHTML=`<div class="topline"><div><h2>${data.tab==='inbox'?'Donna · Eingang':'Alle offenen Aufgaben'}</h2><p class="muted">${data.tab==='inbox'?'Schnell sammeln, später einsortieren.':'Projektübergreifend, ohne Pflichttermine.'}</p></div><button class="btn primary" data-action="add" data-id="${data.tab==='inbox'?'inbox':''}">＋ Aufgabe</button></div><div class="tasks">${nodes.length?nodes.map(n=>`<div class="task"><input type="checkbox" data-action="done" data-id="${n.id}" ${n.done?'checked':''}><div class="detail"><strong>${esc(n.name)}</strong><small>${esc(path(n))} · ${esc(n.priority||'bald')}${n.due?' · '+esc(n.due):''}</small></div><button class="btn" data-action="edit" data-id="${n.id}">✎</button></div>`).join(''):'<div class="panel muted">Noch keine Aufgaben hier.</div>'}</div>`}}function options(exclude){const valid=data.nodes.filter(n=>n.id!==exclude&&!descendants(exclude||'').includes(n.id));return `<option value="inbox">Donna · Eingang</option>`+valid.map(n=>`<option value="${n.id}">${esc(path(n))}</option>`).join('')}function openEditor(id,parent){editId=id||null;newParent=parent||null;const n=id?get(id):null;$('editHeading').textContent=n?'Eintrag bearbeiten':'Neuer Eintrag';$('name').value=n?.name||'';$('priority').value=normalizePriority(n?.priority);$('kind').value=n?.kind||'task';$('birthday').value=n?.birthday  if(b.dataset.action==='song-add'){const name=prompt('Welches Lied möchtest du in deine Lagerfeuer-Liste aufnehmen?');if(name&&name.trim()){data.songs.push(name.trim());save();render()}}
 if(b.dataset.action==='song-delete'){const i=Number(b.dataset.index);if(Number.isInteger(i)&&confirm('Lied aus der Lagerfeuer-Liste entfernen?')){data.songs.splice(i,1);save();render()}}
},true);
// Draw connector lines using actual card positions instead of fragile CSS pseudo-elements.
function drawConnectors(){const scroll=document.querySelector('.tree-scroll');if(!scroll)return;const tree=scroll.querySelector('.tree');if(!tree)return;tree.style.position='relative';let svg=tree.querySelector(':scope > svg.connectors');if(svg)svg.remove();const ns='http://www.w3.org/2000/svg';svg=document.createElementNS(ns,'svg');svg.setAttribute('class','connectors');svg.setAttribute('width',String(tree.scrollWidth));svg.setAttribute('height',String(tree.scrollHeight));svg.setAttribute('viewBox',`0 0 ${tree.scrollWidth} ${tree.scrollHeight}`);svg.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible';const bounds=tree.getBoundingClientRect();const centerX=el=>{const r=el.getBoundingClientRect();return r.left-bounds.left+r.width/2};const topY=el=>el.getBoundingClientRect().top-bounds.top;const bottomY=el=>el.getBoundingClientRect().bottom-bounds.top;
 for(const branch of tree.querySelectorAll('.branch')){const parent=branch.querySelector(':scope > .node');const container=branch.querySelector(':scope > .children');if(!parent||!container)continue;const children=[...container.children].filter(x=>x.classList.contains('branch')).map(x=>x.querySelector(':scope > .node')).filter(Boolean);if(!children.length)continue;const px=centerX(parent),py=bottomY(parent);const mid=(py+Math.min(...children.map(topY)))/2;const segments=[[px,py,px,mid]];if(children.length>1){segments.push([centerX(children[0]),mid,centerX(children.at(-1)),mid])}for(const child of children)segments.push([centerX(child),mid,centerX(child),topY(child)]);for(const [x1,y1,x2,y2] of segments){const line=document.createElementNS(ns,'line');for(const [k,v] of Object.entries({x1,y1,x2,y2}))line.setAttribute(k,String(v));line.setAttribute('stroke','#789b84');line.setAttribute('stroke-width','2.5');line.setAttribute('stroke-linecap','round');svg.append(line)}}tree.prepend(svg)}
const renderV04=render;render=function(){renderV04();requestAnimationFrame(drawConnectors)};
window.addEventListener('resize',()=>requestAnimationFrame(drawConnectors));
render();
