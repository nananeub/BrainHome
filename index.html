<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f0"><title>BrainHome</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#263a31;background:#f6f5f0}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid #dce3dc;background:#fff}h1{font-size:24px;letter-spacing:-1px;margin:0}small,.muted{color:#728177}main{max-width:1100px;margin:auto;padding:20px 14px 70px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:22px}.tabs button,.pill{border:1px solid #d6e0d7;border-radius:20px;padding:10px 15px;background:#fff;color:#31483b;white-space:nowrap}.tabs button.active{background:#284b3b;color:white}.panel{background:white;border:1px solid #e0e6df;border-radius:18px;padding:18px;margin:12px 0}.project-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.project{background:#fff;border:1px solid #dfe5df;border-radius:16px;padding:20px;text-align:left;min-height:105px}.project strong{display:block;font-size:18px;margin-bottom:8px}.project:hover,.pill:hover{border-color:#638a72}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:12px 0 18px}.primary{background:#315b47!important;color:#fff!important;border:1px solid #315b47!important}.btn{border:1px solid #d4ded5;background:white;border-radius:10px;padding:9px 12px;color:#294534}.btn:disabled{opacity:.5}.tree-scroll{overflow:auto;padding:20px 14px 30px;min-height:180px;border:1px solid #e5e9e4;border-radius:16px;background:radial-gradient(#dce6dd 0.7px,transparent .7px);background-size:18px 18px}.tree,.children{display:flex;justify-content:center;align-items:flex-start;gap:18px;min-width:max-content}.branch{display:flex;flex-direction:column;align-items:center;position:relative}.children{position:relative;padding-top:27px}.branch:has(>.children)>.node:after{content:"";position:absolute;bottom:-27px;left:50%;height:27px;border-left:2px solid #9db5a5}.children>.branch:before{content:"";position:absolute;top:-27px;left:50%;height:27px;border-left:2px solid #9db5a5}.children>.branch:not(:only-child):after{content:"";position:absolute;top:-27px;height:2px;background:#9db5a5;left:calc(-9px - 50%);width:calc(100% + 18px);z-index:0}.children>.branch:first-child:after{left:50%;width:calc(50% + 9px)}.children>.branch:last-child:after{left:calc(-9px - 50%);width:calc(50% + 9px)}.children>.branch:only-child:after{display:none}.node{position:relative;z-index:1;width:178px;min-height:74px;background:white;border:1.5px solid #a8bcae;border-radius:13px;padding:9px;box-shadow:0 3px 8px #243b2b0b;text-align:center;overflow-wrap:anywhere}.node.done{opacity:.52}.node.done .name{text-decoration:line-through}.node .name{display:block;font-weight:650;font-size:13px;margin:3px 0 8px}.node .actions{display:flex;justify-content:center;gap:5px}.mini{background:#eff4ef;border:0;border-radius:7px;padding:4px 7px;font-size:12px;color:#2e513e}.node .status{font-size:11px;color:#65786a}.leaf-more{margin-top:8px;font-size:11px}.tasks{display:grid;gap:8px}.task{display:flex;align-items:center;gap:10px;border:1px solid #e1e8e1;border-radius:12px;padding:12px;background:white}.task .detail{flex:1;min-width:0}.task .detail small{display:block;margin-top:3px}.task input[type=checkbox]{width:18px;height:18px;accent-color:#315b47}dialog{border:0;border-radius:18px;padding:0;max-width:min(95vw,460px);width:100%;box-shadow:0 20px 80px #0004}dialog::backdrop{background:#1b2b2299}.modal{padding:22px}.field{display:grid;gap:5px;margin:12px 0}.field input,.field textarea,.field select{width:100%;border:1px solid #cbd8cc;border-radius:9px;padding:11px;background:white}.modal footer{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}.hint{font-size:13px;line-height:1.5;color:#65776a}.topline{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}#notice{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#284b3b;color:white;border-radius:12px;padding:10px 15px;display:none;z-index:5} @media(max-width:600px){main{padding:15px 10px 70px}header{padding:15px}.panel{padding:14px}.project-grid{grid-template-columns:1fr 1fr}.project{padding:15px;min-height:92px}.tree-scroll{padding:14px 10px 26px}}
</style></head><body><header><div><h1>BrainHome<span style="color:#79a08a">.</span></h1><small>Ein Zuhause für deine Gedanken</small></div><button class="btn" id="backupBtn">↥ Backup</button></header><main><nav class="tabs"><button data-tab="projects" class="active">Projekte</button><button data-tab="all">Alle Aufgaben</button><button data-tab="inbox">Donna · Eingang</button></nav><div id="app"></div></main><div id="notice"></div><dialog id="editor"><form id="editForm" class="modal"><h2 id="editHeading" style="margin:0">Aufgabe</h2><div class="field"><label for="name">Name</label><input id="name" required maxlength="250" autocomplete="off"></div><div class="field"><label for="priority">Wann?</label><select id="priority"><option value="bald">Bald · ohne Deadline</option><option value="jetzt">Jetzt wichtig</option><option value="irgendwann">Irgendwann</option><option value="wartet">Wartet</option></select></div><div class="field"><label for="due">Fällig am (optional)</label><input id="due" type="date"></div><div class="field"><label for="notes">Notizen (optional)</label><textarea id="notes" rows="3"></textarea></div><div class="field" id="parentField"><label for="parent">Unter welchem Punkt?</label><select id="parent"></select></div><footer><button type="button" class="btn" id="deleteBtn">Löschen</button><button type="button" class="btn" id="cancelBtn">Abbrechen</button><button type="submit" class="btn primary">Speichern</button></footer></form></dialog><dialog id="backupDialog"><div class="modal"><h2>Datensicherung</h2><p class="hint">Die Daten liegen nur in diesem Browser auf diesem Gerät. Sichere regelmäßig eine JSON-Datei. GitHub speichert deine persönlichen Aufgaben nicht.</p><button class="btn primary" id="exportBtn">Backup herunterladen</button><div class="field"><label for="importFile">Backup wiederherstellen (ersetzt alle aktuellen Daten)</label><input type="file" id="importFile" accept=".json,application/json"></div><footer><button class="btn" id="closeBackup">Schließen</button></footer></div></dialog><script>
'use strict';const KEY='brainhome-v02';const roots=[['Studienstiftung','🤝'],['Doktorarbeit','🧪'],['Uni','🎓'],['Beziehungen','♡'],['Privat','⌂']];const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();let data;function initial(){return {version:2,nodes:roots.map(([name,emoji])=>({id:uid(),parent:null,name,emoji,done:false,priority:'bald',due:'',notes:'',collapsed:false})),tab:'projects',active:null}}try{data=JSON.parse(localStorage.getItem(KEY));if(!data||!Array.isArray(data.nodes))throw Error()}catch{data=initial()}let depthLimit=5,showDone=true,editId=null,newParent=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=id=>data.nodes.find(n=>n.id===id),kids=id=>data.nodes.filter(n=>n.parent===id),rootOf=n=>{while(n&&n.parent)n=get(n.parent);return n},rootName=n=>rootOf(n)?.name||'Donna';const descendants=id=>{let out=[];for(const n of kids(id)){out.push(n.id,...descendants(n.id))}return out};function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Speichern fehlgeschlagen! Bitte ein Backup exportieren.')}}function notice(s){$('notice').textContent=s;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2200)}function setTab(t){data.tab=t;save();render()}function openProject(id){data.active=id;data.tab='tree';save();render()}function setDone(id,v){get(id).done=v;save();render()}function toggle(id){get(id).collapsed=!get(id).collapsed;save();render()}function path(n){let p=[n.name];while(n.parent){n=get(n.parent);if(!n)break;p.unshift(n.name)}return p.join(' › ')}function nodeHTML(n,depth){if(!showDone&&n.done)return '';const child=kids(n.id).filter(x=>showDone||!x.done),expand=depth<depthLimit&&!n.collapsed;return `<div class="branch"><div class="node ${n.done?'done':''}"><span class="status">${n.done?'✓ Erledigt':esc(n.priority||'bald')}</span><span class="name">${esc(n.name)}</span><div class="actions"><button class="mini" title="Unteraufgabe hinzufügen" data-action="add" data-id="${n.id}">＋</button><button class="mini" title="Bearbeiten" data-action="edit" data-id="${n.id}">✎</button><button class="mini" title="${n.done?'Wieder öffnen':'Erledigen'}" data-action="done" data-id="${n.id}">${n.done?'↺':'✓'}</button>${child.length?`<button class="mini" title="Zweig ein-/ausklappen" data-action="toggle" data-id="${n.id}">${expand?'−':'+'}${child.length}</button>`:''}</div></div>${child.length&&expand?`<div class="children">${child.map(x=>nodeHTML(x,depth+1)).join('')}</div>`:child.length&&!n.collapsed?`<button class="btn leaf-more" data-action="deeper">${child.length} weitere · Tiefe erhöhen</button>`:''}</div>`}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===data.tab||(data.tab==='tree'&&b.dataset.tab==='projects')));const a=$('app');if(data.tab==='projects'){a.innerHTML=`<div class="topline"><div><h2>Deine Lebensbereiche</h2><p class="muted">Alles hat seinen Platz. Ohne künstliche Deadlines.</p></div></div><div class="project-grid">${data.nodes.filter(n=>!n.parent).map(n=>`<button class="project" data-action="project" data-id="${n.id}"><strong>${esc(n.emoji||'🌿')} ${esc(n.name)}</strong><small>${descendants(n.id).filter(id=>!get(id).done).length} offene Aufgaben</small></button>`).join('')}</div><p class="hint">Öffne einen Bereich, um deinen Baum zu sehen. Donna ist dein schneller Eingang für ungeordnete Gedanken.</p>`}else if(data.tab==='tree'){const root=get(data.active);if(!root){setTab('projects');return}a.innerHTML=`<div class="topline"><div><button class="btn" data-action="back">← Projekte</button><h2>${esc(root.emoji||'🌿')} ${esc(root.name)}</h2></div><button class="btn primary" data-action="add" data-id="${root.id}">＋ Aufgabe</button></div><div class="toolbar"><button class="btn" data-action="less">− Tiefe</button><span class="muted">${depthLimit} Ebenen</span><button class="btn" data-action="deeper">＋ Tiefe</button><button class="btn" data-action="showdone">${showDone?'✓ Erledigte sichtbar':'Erledigte zeigen'}</button></div><div class="tree-scroll"><div class="tree">${nodeHTML(root,0)}</div></div><p class="hint">Seitlich wischen, um breite Äste zu sehen. Tippe auf ＋ an einem Knoten, um dort einen neuen Zweig anzulegen. Alle Änderungen werden automatisch gespeichert.</p>`}else{let nodes=data.nodes.filter(n=>n.parent&&(data.tab==='inbox'?rootName(n)==='Donna':!n.done));if(data.tab==='inbox')nodes=data.nodes.filter(n=>n.parent==='inbox');const order={jetzt:0,bald:1,wartet:2,irgendwann:3};nodes.sort((a,b)=>(order[a.priority]??1)-(order[b.priority]??1));a.innerHTML=`<div class="topline"><div><h2>${data.tab==='inbox'?'Donna · Eingang':'Alle offenen Aufgaben'}</h2><p class="muted">${data.tab==='inbox'?'Schnell sammeln, später einsortieren.':'Projektübergreifend, ohne Pflichttermine.'}</p></div><button class="btn primary" data-action="add" data-id="${data.tab==='inbox'?'inbox':''}">＋ Aufgabe</button></div><div class="tasks">${nodes.length?nodes.map(n=>`<div class="task"><input type="checkbox" data-action="done" data-id="${n.id}" ${n.done?'checked':''}><div class="detail"><strong>${esc(n.name)}</strong><small>${esc(path(n))} · ${esc(n.priority||'bald')}${n.due?' · '+esc(n.due):''}</small></div><button class="btn" data-action="edit" data-id="${n.id}">✎</button></div>`).join(''):'<div class="panel muted">Noch keine Aufgaben hier.</div>'}</div>`}}function options(exclude){const valid=data.nodes.filter(n=>n.id!==exclude&&!descendants(exclude||'').includes(n.id));return `<option value="inbox">Donna · Eingang</option>`+valid.map(n=>`<option value="${n.id}">${esc(path(n))}</option>`).join('')}function openEditor(id,parent){editId=id||null;newParent=parent||null;const n=id?get(id):null;$('editHeading').textContent=n?'Aufgabe bearbeiten':'Neue Aufgabe';$('name').value=n?.name||'';$('priority').value=n?.priority||'bald';$('due').value=n?.due||'';$('notes').value=n?.notes||'';$('parent').innerHTML=options(id);$('parent').value=n?.parent||parent||'inbox';$('deleteBtn').hidden=!n;$('editor').showModal();$('name').focus()}$('editForm').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;const parent=$('parent').value;const fields={name,priority:$('priority').value,due:$('due').value,notes:$('notes').value,parent};if(editId){Object.assign(get(editId),fields)}else data.nodes.push({id:uid(),done:false,collapsed:false,...fields});save();$('editor').close();render();notice('Gespeichert')});$('cancelBtn').onclick=()=>$('editor').close();$('deleteBtn').onclick=()=>{if(!editId)return;const ids=[editId,...descendants(editId)];if(!confirm(`Diesen Punkt und ${ids.length-1} Unterpunkte wirklich löschen?`))return;data.nodes=data.nodes.filter(n=>!ids.includes(n.id));save();$('editor').close();render()};document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id;switch(b.dataset.action){case'project':openProject(id);break;case'back':setTab('projects');break;case'add':openEditor(null,id);break;case'edit':openEditor(id);break;case'done':setDone(id,!get(id).done);break;case'toggle':toggle(id);break;case'deeper':depthLimit=Math.min(100,depthLimit+5);render();break;case'less':depthLimit=Math.max(1,depthLimit-5);render();break;case'showdone':showDone=!showDone;render();break}});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('backupBtn').onclick=()=>$('backupDialog').showModal();$('closeBackup').onclick=()=>$('backupDialog').close();$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,nodes:data.nodes},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BrainHome-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d.nodes)||!d.nodes.every(n=>typeof n.id==='string'&&typeof n.name==='string'&&typeof n.parent==='string'||n.parent===null&&typeof n.id==='string'&&typeof n.name==='string'))throw Error('Ungültiges Format');if(!confirm('Alle aktuellen Aufgaben durch dieses Backup ersetzen?'))return;data={version:2,nodes:d.nodes,tab:'projects',active:null};save();$('backupDialog').close();render();notice('Backup importiert')}catch(err){alert('Import fehlgeschlagen: '+err.message)}e.target.value=''};render();
</script></body></html>
